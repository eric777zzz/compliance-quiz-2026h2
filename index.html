<script>
const BANK=[{"id": 1, "stem": "【單選題】\n以下敘述是否符合法令規定：\n當客戶來行辦理印鑑變更業務時，且同時表明其已取得美國籍時，行員應請客戶重新填哪些FATCA文件？", "options": [{"key": "A", "text": "CRS_個人自我證明。"}, {"key": "B", "text": "CRS_個人自我證明及W-9。"}, {"key": "C", "text": "CRS_個人自我證明、W-9及同意函。"}, {"key": "D", "text": "W-8BEN及同意函"}], "answer": ["C"], "source": "0000711400161/FATCA及CRS常見實務案例", "category": "法遵", "multi": false}, {"id": 2, "stem": "【單選題】\n有關向客戶重新徵提自我證明文件的時機，下列何者正確？", "options": [{"key": "A", "text": "客戶國籍或現居地國籍有變更時。"}, {"key": "B", "text": "消極非金融機構實體之具控制權人有異動時。"}, {"key": "C", "text": "消極非金融機構實體之實體自我證明簽署超過3年。"}, {"key": "D", "text": "所有選項皆正確。"}], "answer": ["D"], "source": "0000711400161/FATCA及CRS常見實務案例", "category": "法遵", "multi": false}, {"id": 3, "stem": "【單選題】\n以下敘述是否符合法令規定：\n依「外匯收支或交易申報辦法」應視同申報義務人者，包含法定代理人代辦結匯申報者、公司或個人以自己名義為他人辦理結匯申報者等。", "options": [{"key": "A", "text": "是。"}, {"key": "B", "text": "否。"}], "answer": ["A"], "source": "0000711500083/外匯業務法規及常見缺失", "category": "法遵", "multi": false}, {"id": 4, "stem": "【複選題】「4選3」\n下列關於外匯業務之敘述，何者正確？", "options": [{"key": "A", "text": "外匯指定銀行於非共同營業時間辦理外匯業務，其每筆結匯之金額並無限制。"}, {"key": "B", "text": "辦理外匯收支或交易，金額達新臺幣50萬元或等值外幣者，應依規定向中央銀行申報。"}, {"key": "C", "text": "外匯業務之經辦人員，應具備外匯業務執照或具有3個月以上之外匯相關業務經歷。"}, {"key": "D", "text": "已結婚之未成年人如有新臺幣50萬元以上之必要性外匯收付，可檢附相關證明文件，經由銀行業向央行申請核准後，逕行辦理結匯。"}], "answer": ["B", "C", "D"], "source": "0000711500083/外匯業務法規及常見缺失", "category": "法遵", "multi": true}, {"id": 5, "stem": "【單選題】\n以下敘述是否符合法令規定：\n本行如因特定行員之故意或重大過失行為所發生之裁罰案件，本行應依銀行法對該特定行員求償。", "options": [{"key": "A", "text": "是。"}, {"key": "B", "text": "否。"}], "answer": ["A"], "source": "0000711500108/本行受銀行法罰鍰對應負責之人求償事宜", "category": "法遵", "multi": false}, {"id": 6, "stem": "【複選題】「4選3」\n下列有關銀行辦理利害關係人授信的敘述，何者為正確？", "options": [{"key": "A", "text": "銀行對「其持有實收資本額百分之五以上之企業」為擔保授信，應有十足擔保，其條件不得優於其他同類授信對象。"}, {"key": "B", "text": "甲金控下的A銀行子公司，可以為「B保險子公司之負責人」辦理無擔保授信。"}, {"key": "C", "text": "乙金控下的C銀行子公司，辦理「乙金控負責人所擔任負責人之企業」授信案時，不得為無擔保授信。"}, {"key": "D", "text": "銀行協理的妻子擔任董事的企業，辦理單筆達新台幣1億元之授信，應提報董事會決議 const KEY='compliance-2026h2-v1';let paper=0,wrongOnly=false;
const fresh=()=>({answers:{},submitted:false});let states=[fresh(),fresh(),fresh()];
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.length===3)states=saved.map(s=>({answers:s.answers&&typeof s.answers==='object'?s.answers:{},submitted:s.submitted===true}));}catch{}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>BANK.slice(paper*50,(paper+1)*50),selected=q=>Array.isArray(states[paper].answers[q.id])?states[paper].answers[q.id]:[],isCorrect=q=>[...selected(q)].sort().join('')===q.answer.join('');
function save(){try{localStorage.setItem(KEY,JSON.stringify(states));}catch{$('#notice').textContent='瀏覽器無法保存作答紀錄；關閉頁面後進度可能遺失。';}}
function update(){const qs=current(),s=states[paper],done=qs.filter(q=>selected(q).length).length;$('#status').textContent=`第 ${paper+1} 卷 · 已答 ${done} / 50 題`;$('#progress').value=done;$('.nav').innerHTML=qs.map((q,i)=>`<a href="#q${q.id}" aria-label="第${i+1}題，原題號${q.id}" class="${s.submitted?(isCorrect(q)?'good':'bad'):(selected(q).length?'done':'')}">${i+1}</a>`).join('');$('#submit').hidden=s.submitted;$('#filter').hidden=!s.submitted;$('#filter').textContent=wrongOnly?'顯示全部題目':'只看錯題與未答';const good=qs.filter(isCorrect).length;$('#result').innerHTML=s.submitted?`<div class="score">${good*2} / 100 分</div><div>答對 ${good} 題 · 答錯 ${done-good} 題 · 未答 ${50-done} 題</div><p>下方可查看正確答案與題庫出處。</p>`:'';}
function render(){const s=states[paper];$('.tabs').innerHTML=[0,1,2].map(p=>`<button data-paper="${p}" class="${p===paper?'active':''}" aria-pressed="${p===paper}">第 ${p+1} 卷 <small>題 ${p*50+1}–${p*50+50}</small></button>`).join('');$('#questions').innerHTML=current().map((q,i)=>{const a=selected(q),good=isCorrect(q);if(wrongOnly&&good)return '';return `<article id="q${q.id}" class="card ${s.submitted?(good?'correct':'incorrect'):''}"><div class="tag">第 ${i+1} 題 · 原題號 ${q.id} · ${esc(q.category)} · ${q.multi?'複選':'單選'}</div><div class="stem">${esc(q.stem)}</div>${q.options.map(o=>`<label class="option"><input type="${q.multi?'checkbox':'radio'}" name="q${q.id}" data-id="${q.id}" value="${o.key}" ${a.includes(o.key)?'checked':''} ${s.submitted?'disabled':''}><span><strong>${o.key}.</strong> ${esc(o.text)}</span></label>`).join('')}${s.submitted?`<div class="feedback"><strong>${good?'答對':a.length?'答錯':'未作答'} · 正確答案：${q.answer.join('、')}</strong><br>你的答案：${a.join('、')||'未作答'}<br><span class="muted">出處：${esc(q.source)}</span></div>`:''}</article>`;}).join('')||'<div class="card">本卷全部答對，沒有錯題。</div>';update();}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-paper]');if(!b)return;paper=Number(b.dataset.paper);wrongOnly=false;render();});
$('#questions').addEventListener('change',e=>{const input=e.target;if(!input.matches('input[data-id]')||states[paper].submitted)return;const id=Number(input.dataset.id),q=BANK.find(q=>q.id===id);states[paper].answers[id]=q.multi?[...document.querySelectorAll(`input[data-id="${id}"]:checked`)].map(x=>x.value):[input.value];save();update();});
$('#submit').onclick=()=>{const remaining=current().filter(q=>!selected(q).length).length;if(!confirm(remaining?`還有 ${remaining} 題未答，未答題以 0 分計算。確定交卷？`:'確定交卷並查看成績？'))return;states[paper].submitted=true;wrongOnly=false;save();render();$('#result').focus();};
$('#reset').onclick=()=>{if(!confirm('確定清除本卷作答與成績？其他試卷不受影響。'))return;states[paper]=fresh();wrongOnly=false;save();render();};
$('#filter').onclick=()=>{wrongOnly=!wrongOnly;render();};$('#print').onclick=()=>window.print();render();
</script></html>
